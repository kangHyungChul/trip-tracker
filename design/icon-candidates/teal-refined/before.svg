<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    홈 화면용 원본 아이콘 (512×512, 모서리 없이 꽉 찬 정사각형).
    - iOS·Android가 각자 모서리를 둥글게/원형으로 잘라내므로 배경은 끝까지 채웁니다.
    - Android maskable 안전 영역(중심에서 반지름 약 205px 원) 안에 그림을 모두 넣었습니다.
    - 이 파일을 고친 뒤 npm run icons 를 실행하면 PNG가 다시 만들어집니다.
  -->

  <!-- 배경: 현재 사이트의 청록색 -->
  <rect width="512" height="512" fill="#087f8c"/>

  <!-- 출발점에서 핀까지 이어지는 점선 경로 (금색, 둥근 끝 점선) -->
  <path d="M146 382 C 168 318, 236 430, 292 372"
        fill="none" stroke="#b99459" stroke-width="16"
        stroke-linecap="round" stroke-dasharray="2 28"/>

  <!-- 출발점: 아이보리 테두리 + 배경색 속 -->
  <circle cx="146" cy="382" r="20" fill="#fffefa"/>
  <circle cx="146" cy="382" r="8" fill="#087f8c"/>

  <!-- 지도 핀: 위쪽 원(중심 300,206 / 반지름 84)과 아래 뾰족한 끝(300,372)을 곡선으로 연결 -->
  <path d="M300 372 C 274 334, 216 282, 216 206 A 84 84 0 1 1 384 206 C 384 282, 326 334, 300 372 Z"
        fill="#fffefa"/>

  <!-- 핀 가운데 구멍: 금색 점 -->
  <circle cx="300" cy="206" r="32" fill="#b99459"/>
</svg>
