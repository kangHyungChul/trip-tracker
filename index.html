<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#087f8c">
    <meta name="description" content="여러 여행 일정을 지도·맛집·주차·비용과 함께 한눈에 보고 직접 편집하는 여행 플래너.">
    <title>TRIP TRACKER</title>
    <!-- 브라우저 탭 아이콘: SVG 지원 브라우저는 svg, 나머지는 32px PNG -->
    <link rel="icon" href="/favicon.svg?v=8" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png?v=8" type="image/png" sizes="32x32">
    <!-- iOS ‘홈 화면에 추가’ 아이콘과 이름 (iOS는 manifest 아이콘 대신 이것을 사용) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8">
    <meta name="apple-mobile-web-app-title" content="TRIP TRACKER">
    <!-- Android(Chrome) 홈 화면 아이콘·이름 정보 -->
    <link rel="manifest" href="/manifest.webmanifest?v=8">
</head>
<body>
    <!-- React 앱이 그려지는 자리 (src/main.tsx) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
